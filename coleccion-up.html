  {id:'up20',n:'Termo Panamericana Blanco 25 oz UP',cat:'termos',p:'$420',img:'images/termo-panamericana-blanco25oz.png',tag:'new',desc:'Termo blanco Panamericana UP de 25 oz con gran capacidad.'},
  {id:'up21',n:'Termo Pantera 30 oz UP',cat:'termos',p:'$440',img:'images/termo-pantera-30oz.png',tag:'new',desc:'Termo UP de 30 oz con diseño de pantera.'},
  {id:'up22',n:'Termo Panamericana Blanco 40 oz UP',cat:'termos',p:'$480',img:'images/termo-panamericana-boanco40oz.png',tag:'new',desc:'Termo blanco Panamericana UP de 40 oz para acompañarte todo el dia.'},
  {id:'up23',n:'Termo Pantera 40 oz UP',cat:'termos',p:'$480',img:'images/termo-pantera1-40oz.png',tag:'new',desc:'Termo UP de 40 oz con diseño de pantera y capacidad amplia.'},
];
let wish=JSON.parse(localStorage.getItem('ellier_wish')||'[]');
const WISH_META_KEY='ellier_wish_products';
function getWishMeta(){return JSON.parse(localStorage.getItem(WISH_META_KEY)||'{}')}
function saveWishMeta(p){if(!p)return;const meta=getWishMeta();meta[p.id]={id:p.id,n:p.n,cat:p.cat,p:p.p,clr:'#0a0a0a',img:p.img||null};localStorage.setItem(WISH_META_KEY,JSON.stringify(meta))}
function removeWishMeta(id){const meta=getWishMeta();delete meta[id];localStorage.setItem(WISH_META_KEY,JSON.stringify(meta))}
let _heroIdx=0,_heroTimer=null;
let _prodReq={id:null,img:null,fileName:''};
function escHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const REVIEW_KEY='ellier_product_reviews';
let _reviewMedia=null;
function getReviewStore(){try{return JSON.parse(localStorage.getItem(REVIEW_KEY)||'{}')||{}}catch{return{}}}
function productReviews(id){return getReviewStore()[id]||[]}
function starText(rate){const n=Math.max(0,Math.min(5,parseInt(rate)||0));return [1,2,3,4,5].map(i=>`<span>${i<=n?'★':'☆'}</span>`).join('')}
function reviewPicker(rating=5){return `<div class="pdrev-picker" id="pdrev-rate" data-rating="${rating}" role="radiogroup" aria-label="Calificación">${[1,2,3,4,5].map(n=>`<button type="button" class="pdrev-star ${n<=rating?'a':''}" onclick="setReviewRating(${n})" aria-label="${n} estrella${n!==1?'s':''}">★</button>`).join('')}</div>`}
function setReviewRating(rate){const box=document.getElementById('pdrev-rate');if(!box)return;const n=Math.max(0,Math.min(5,parseInt(rate)||0));box.dataset.rating=n;box.querySelectorAll('.pdrev-star').forEach((b,i)=>b.classList.toggle('a',i<n))}
function reviewMediaHtml(media){if(!media||!media.src)return'';const src=escHtml(media.src),alt=escHtml(media.name||'Evidencia del producto');return media.type==='video'?`<div class="pdrev-media"><video src="${src}" controls playsinline preload="metadata"></video></div>`:`<div class="pdrev-media"><img src="${src}" alt="${alt}" loading="lazy" decoding="async"/></div>`}
function reviewFilePreview(media){if(!media||!media.src)return'';const src=escHtml(media.src);return media.type==='video'?`<video src="${src}" controls playsinline preload="metadata"></video>`:`<img src="${src}" alt="${escHtml(media.name||'Evidencia')}"/>`}
function handleReviewFile(inp){const file=inp.files&&inp.files[0];if(!file){_reviewMedia=null;return}const err=document.getElementById('pdrev-err');if(err)err.classList.remove('s');if(!/^image\//.test(file.type)&&!/^video\//.test(file.type)){if(err){err.textContent='Adjunta una imagen o video valido.';err.classList.add('s')}inp.value='';_reviewMedia=null;return}if(file.size>2*1024*1024){if(err){err.textContent='El archivo debe pesar maximo 2 MB.';err.classList.add('s')}inp.value='';_reviewMedia=null;return}const reader=new FileReader();reader.onload=e=>{_reviewMedia={src:e.target.result,type:file.type.startsWith('video/')?'video':'image',name:file.name||'evidencia'};const prev=document.getElementById('pdrev-media-preview');if(prev){prev.innerHTML=reviewFilePreview(_reviewMedia);prev.style.display='block'}};reader.readAsDataURL(file)}
function renderReviewBlock(id){_reviewMedia=null;const list=productReviews(id).slice().reverse(),avg=list.length?Math.round((list.reduce((s,r)=>s+(parseInt(r.rating)||0),0)/list.length)*10)/10:0,score=list.length?avg.toFixed(avg%1?1:0):'0';const rows=list.length?list.map(r=>`<div class="pdrev-item"><div class="pdrev-head"><div><div class="pdrev-name">${escHtml(r.name||'Cliente ELLIÉR')}</div><div class="pdrev-date">${r.ts?new Date(r.ts).toLocaleDateString('es-MX'):''}</div></div><div class="pdrev-stars">${starText(r.rating)}</div></div><div class="pdrev-comment">${escHtml(r.comment)}</div>${reviewMediaHtml(r.media)}</div>`).join(''):'<div class="pdrev-empty">Sé la primera persona en dejar una reseña de este producto.</div>';return `<div class="pdrev"><div class="pdrev-lbl">Opiniones de clientes</div><div class="pdrev-summary"><div class="pdrev-score">${score}</div><div><div class="pdrev-stars">${starText(Math.round(avg))}</div><div class="pdrev-meta">${list.length?list.length+' reseña'+(list.length!==1?'s':'')+' publicada'+(list.length!==1?'s':''):'Sin reseñas todavía'}</div></div></div><div class="pdrev-form"><div class="pdrev-row">${reviewPicker()}<input class="pdrev-input" id="pdrev-name-inp" maxlength="32" placeholder="Tu nombre público" required/></div><textarea class="pdrev-text" id="pdrev-comment" maxlength="260" placeholder="Cuéntanos cómo te quedó, qué te gustó o qué mejorarías..."></textarea><label class="pdrev-file">Agregar foto o video del producto (opcional)<input id="pdrev-file" type="file" accept="image/*,video/*" onchange="handleReviewFile(this)"/><div class="pdrev-media-preview" id="pdrev-media-preview"></div></label><button type="button" class="pdrev-clear" onclick="setReviewRating(0)">Sin calificación</button><div class="pdrev-err" id="pdrev-err">Escribe tu nombre público y una reseña antes de publicarla.</div><button class="pdrev-btn" onclick="addProductReview('${id}')">Publicar opinión</button></div><div class="pdrev-list">${rows}</div></div>`}
function addProductReview(id){const rating=Math.max(0,Math.min(5,parseInt(document.getElementById('pdrev-rate')?.dataset.rating)||0));const name=(document.getElementById('pdrev-name-inp')?.value||'').trim();const comment=(document.getElementById('pdrev-comment')?.value||'').trim();const err=document.getElementById('pdrev-err');if(err){err.textContent='Escribe tu nombre público y una reseña antes de publicarla.';err.classList.remove('s')}if(name.length<2||comment.length<4){err?.classList.add('s');return}const store=getReviewStore();store[id]=store[id]||[];store[id].push({rating,name,comment,media:_reviewMedia,ts:Date.now()});_reviewMedia=null;try{localStorage.setItem(REVIEW_KEY,JSON.stringify(store))}catch(e){store[id].pop();if(err){err.textContent='El archivo es demasiado pesado para guardar la opinion.';err.classList.add('s')}return}document.getElementById('pd-reviews').innerHTML=renderReviewBlock(id);showToast('Reseña publicada')}
function openProdReq(id){
  const p=PRODUCTS.find(x=>x.id===id);if(!p)return;
  _prodReq={id,img:null,fileName:''};
  document.getElementById('pr-name').textContent=p.n;
  document.getElementById('pr-cat').textContent=p.cat||'Producto';
  document.getElementById('pr-img').innerHTML=`<img src="${p.img}" alt="${p.n}"/>`;
  document.getElementById('pr-desc').value='';
  document.getElementById('pr-file').value='';
  document.getElementById('pr-thumb').style.display='none';
  document.getElementById('pr-thumb-img').src='';
  document.getElementById('pr-err').classList.remove('s');
  validateProdReq();
  document.getElementById('pro').classList.add('o');
  document.getElementById('prp').classList.add('o');
}
function closeProdReq(){
  document.getElementById('pro').classList.remove('o');
  document.getElementById('prp').classList.remove('o');
}
function handleProdReqFile(inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      _prodReq.img=cv.toDataURL('image/jpeg',.86);
      _prodReq.fileName=(file.name||'referencia').replace(/\.[^.]+$/,'')+'.jpg';
      document.getElementById('pr-thumb-img').src=_prodReq.img;
      document.getElementById('pr-thumb').style.display='block';
      validateProdReq();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function validateProdReq(){
  const len=document.getElementById('pr-desc')?.value.trim().length||0;
  const ok=len>=15&&len<=200;
  const btn=document.getElementById('pr-add');if(btn)btn.disabled=!ok;
  return ok;
}
function confirmProdReq(){
  if(!validateProdReq()){document.getElementById('pr-err').classList.add('s');return;}
  const req={desc:document.getElementById('pr-desc').value.trim(),img:_prodReq.img,fileName:_prodReq.fileName};
  const id=_prodReq.id;
  closeProdReq();
  Cart.add(id,req);
}
const Cart={
  items:JSON.parse(localStorage.getItem('ellier_cart')||'[]'),
  save(){localStorage.setItem('ellier_cart',JSON.stringify(this.items));updateCC()},
  add(id,request){
    const p=PRODUCTS.find(x=>x.id===id);if(!p)return;
    if(!request){openProdReq(id);return;}
    this.items.push({id,n:p.n,p:p.p,qty:1,cat:p.cat,clr:'#0a0a0a',img:p.img,requestDesc:request.desc,requestImg:request.img,requestFileName:request.fileName||'referencia.png',trackingRef:'ELL-'+Date.now().toString(36).toUpperCase()});
    this.save();showToast('Agregado al carrito');
  },
  remove(i){this.items.splice(i,1);this.save();renderCart()},
  total(){return this.items.reduce((s,x)=>s+(parseInt((x.p||'0').replace(/\D/g,''))||0)*(x.qty||1),0)}
};
function renderHeroCarousel(){
  const slides=document.getElementById('heroSlides'),dots=document.getElementById('heroDots');
  slides.innerHTML=CATALOG_MEDIA.map((m,i)=>`<div class="hero-slide${i===0?' a':''}" style="background-image:url('${m.img}')" aria-label="${m.title}"></div>`).join('');
  dots.innerHTML=CATALOG_MEDIA.map((_,i)=>`<button class="hero-dot ${i===0?'a':''}" onclick="heroGo(${i})" aria-label="Slide ${i+1}"></button>`).join('');
}
function heroGo(i){
  const slides=document.querySelectorAll('.hero-slide'),dots=document.querySelectorAll('.hero-dot');
  if(!slides.length)return;
  slides[_heroIdx].classList.remove('a');dots[_heroIdx].classList.remove('a');
  _heroIdx=(i+slides.length)%slides.length;
  slides[_heroIdx].classList.add('a');dots[_heroIdx].classList.add('a');
  clearInterval(_heroTimer);_heroTimer=setInterval(()=>heroGo(_heroIdx+1),4200);
}
function productCard(p){
  const on=wish.includes(p.id)?' on':'';
  const tag=p.tag?`<div class="pbg2 ${p.tag==='new'?'nw':'bs'}">${p.tag==='new'?'Nuevo':'Best'}</div>`:'';
  return `<article class="pc" data-cat="${p.cat}"><div class="pci"><div class="pcii" onclick="openDetail('${p.id}')"><img src="${p.img}" alt="${p.n}" loading="lazy" decoding="async"/></div>${tag}<button class="pw${on}" onclick="toggleWish(this,'${p.id}')" aria-label="Favorito"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button></div><div class="pcb"><div class="pcat">${p.cat}</div><div class="pn">${p.n}</div><div class="pdsc">${p.desc}</div><div class="pft"><span class="pp">${p.p}</span><button class="ba" onclick="Cart.add('${p.id}')">+ Carrito</button></div></div></article>`;
}
function renderProducts(){document.getElementById('grid').innerHTML=PRODUCTS.map(productCard).join('')+'<div class="empty-filter" id="emptyFilter">Productos UP proximamente</div>';document.getElementById('pcount').textContent=PRODUCTS.length+' productos UP'}
function filterProducts(btn,cat){
  document.querySelectorAll('.ft').forEach(b=>b.classList.remove('a'));btn.classList.add('a');
  const cats=cat==='all'?[]:cat.split(',');
  let visible=0;
  document.querySelectorAll('.pc').forEach(c=>{
    const show=cat==='all'||cats.includes(c.dataset.cat);
    c.classList.toggle('hd',!show);
    if(show)visible++;
  });
  const empty=document.getElementById('emptyFilter');
  if(empty)empty.classList.toggle('o',visible===0);
}
function openDetail(id){
  const p=PRODUCTS.find(x=>x.id===id);if(!p)return;
  document.getElementById('pd-img').src=p.img;document.getElementById('pd-img').alt=p.n;
  document.getElementById('pd-cat').textContent=p.cat;document.getElementById('pd-name').textContent=p.n;document.getElementById('pd-price').textContent=p.p;document.getElementById('pd-desc').textContent=p.desc;
  document.getElementById('pd-reviews').innerHTML=renderReviewBlock(id);
  document.getElementById('pd-add').onclick=()=>Cart.add(id);
  document.getElementById('pdov').classList.add('o');
}
function closeDetail(){document.getElementById('pdov').classList.remove('o')}
function toggleWish(btn,id){
  const i=wish.indexOf(id);
  if(i>-1){wish.splice(i,1);btn.classList.remove('on');removeWishMeta(id)}else{wish.push(id);btn.classList.add('on');saveWishMeta(PRODUCTS.find(x=>x.id===id))}
  localStorage.setItem('ellier_wish',JSON.stringify(wish));showToast(i>-1?'Eliminado de favoritos':'Agregado a favoritos');
}
function openCart(){renderCart();document.getElementById('cartov').classList.add('o')}
function closeCart(){document.getElementById('cartov').classList.remove('o')}
function cartVisual(x){
  if(x.requestImg)return `<img src="${x.requestImg}" alt="${x.n}"/>`;
  if(x.img)return `<img src="${x.img}" alt="${x.n}"/>`;
  const p=PRODUCTS.find(y=>y.id===x.id);
  if(p&&p.img){x.img=p.img;return `<img src="${p.img}" alt="${x.n}"/>`;}
  return '';
}
function renderCart(){
  const el=document.getElementById('cartitems'),ft=document.getElementById('cartfoot');
  if(!Cart.items.length){el.innerHTML='<div class="empty">Tu carrito esta vacio</div>';ft.style.display='none';return}
  el.innerHTML=Cart.items.map((x,i)=>{
    const req=x.requestDesc?`<p style="font-size:10px;color:var(--su);line-height:1.45;margin-top:4px">${escHtml(x.requestDesc)}</p>`:'';
    return `<div class="ci"><div class="ct2">${cartVisual(x)}</div><div class="cii"><h4>${x.n}</h4><p>${x.cat}${x.requestDesc?' · Detallado':''}</p>${req}<div class="cpri">${x.p} x ${x.qty}</div></div><button class="xb" onclick="Cart.remove(${i})">x</button></div>`;
  }).join('');
  localStorage.setItem('ellier_cart',JSON.stringify(Cart.items));
  ft.style.display='flex';document.getElementById('carttotal').textContent='$'+Cart.total().toLocaleString()+' MXN';
}
function updateCC(){document.getElementById('crtc').textContent=Cart.items.reduce((s,x)=>s+(x.qty||1),0)}
function showToast(txt){const t=document.getElementById('toast');t.textContent=txt;t.classList.add('on');clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.classList.remove('on'),1800)}
renderHeroCarousel();_heroTimer=setInterval(()=>heroGo(_heroIdx+1),4200);
renderProducts();updateCC();
const initial=(location.hash||'').replace('#','');
if(initial&&initial!=='up'){
  const target=(initial==='termos'||initial==='tazas')?'termos,tazas':initial;
  const btn=[...document.querySelectorAll('.ft')].find(b=>b.getAttribute('onclick')?.includes(`'${target}'`));
  if(btn)btn.click();
}
</script>
